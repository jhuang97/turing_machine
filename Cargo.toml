[package]
name = "turing_machine"
version = "0.1.0"
edition = "2024"

[dependencies]
auto_ops = "0.3.0"
bnum = {version = "0.12.1", features = ["numtraits"]}
colored = "2.1.0"
itertools = "0.13.0"
npyz = {version = "0.8.4", features = ["npz"]}
num-rational = "0.4.2"
prettyplease = "0.2.30"
proc-macro2 = "1.0.94"
quote = "1.0.39"
rand = "0.9.2"
rand_pcg = "0.9.0"
strum = "0.26.3"
strum_macros = "0.26.4"
syn = "2.0.99"
pretty-duration = "0.1.1"
num-bigint = "0.4.6"
num-traits = "0.2.19"
num-integer = "0.1.46"
png = "0.18.1"
bitbybit = "2.0.0"
arbitrary-int = "2.1.0"
rayon = "1.12.0"
radix_trie = "0.3.0"
nibble_vec = "0.1"

[profile.release]
overflow-checks = true
